{% extends 'core/base.html' %}
{% load static %}

{% block title %}Menu{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'recipes/css/menu.css' %}">
<main style="background-color: rgba(253, 248, 244, 1);">
    <div class="menu-container">
        <!-- Encabezado -->
        <div class="contact-heading" role="heading" aria-level="1" tabindex="0">Pizza Selection</div>


        <!-- Filtros -->
        <form method="get" class="filters">
            <!-- Filtro Price -->
            <select name="price" class="filter-select" onchange="this.form.submit()">
                <option value="">Price</option>
                <option value="low-to-high" {% if request.GET.price == 'low-to-high' %}selected{% endif %}>Low to High</option>
                <option value="high-to-low" {% if request.GET.price == 'high-to-low' %}selected{% endif %}>High to Low</option>
            </select>

            <!-- Filtro Calories -->
            <select name="calories" class="filter-select" onchange="this.form.submit()">
                <option value="">Calories Watches</option>
                <option value="low-to-high" {% if request.GET.calories == 'low-to-high' %}selected{% endif %}>Low to High</option>
                <option value="high-to-low" {% if request.GET.calories == 'high-to-low' %}selected{% endif %}>High to Low</option>
            </select>

            <!-- Filtro Diet -->
            <select name="diet" class="filter-select" onchange="this.form.submit()">
                <option value="">Diet</option>
                <option value="Vegetarian" {% if request.GET.diet == "Vegetarian" %}selected{% endif %}>Vegetarian</option>
                <option value="Vegan" {% if request.GET.diet == "Vegan" %}selected{% endif %}>Vegan</option>
                <option value="Gluten-Free" {% if request.GET.diet == "Gluten-Free" %}selected{% endif %}>Gluten-Free</option>
                <option value="Egg-Free" {% if request.GET.diet == "Egg-Free" %}selected{% endif %}>Egg-Free</option>
                <option value="Pescatarian" {% if request.GET.diet == "Pescatarian" %}selected{% endif %}>Pescatarian</option>
            </select>

            <!-- Búsqueda -->
            <input type="text" name="search" class="search-box" placeholder="Search by title or ingredients" value="{{ request.GET.search }}" oninput="this.form.submit()">
        </form>


        <!-- Lista de Pizzas -->
        <div class="recipe-grid">
            {% for recipe in recipes %}
            <div class="recipe-card">
                <img src="{{ recipe.image }}" alt="{{ recipe.name }}" class="recipe-image">
                <div class="recipe-info">
                    <h3 class="recipe-title">{{ recipe.name }}</h3>
                    <p class="recipe-price">{{ recipe.price|floatformat:2 }} $</p>
                </div>
                <button class="order-button">Pedir</button>
            </div>
            {% endfor %}
        </div>
    </div>
</main>
{% endblock %}
