{% extends 'core/base.html' %}
{% load static %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'authentication/css/login.css' %}">
<link rel="stylesheet" href="{% static 'authentication/css/edit_profile.css' %}">

<main class="login-main">
    <form method="post" class="login-container">
        {% csrf_token %}
        <h1 class="login-title">Editar Perfil</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="error-message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <!-- Contenedor en forma de grid (dos columnas) -->
        <div class="form-grid">
            <!-- Columna izquierda (con nombre, email, contraseña y teléfono) -->
            <div>
                <div class="form-group">
                    <label for="username" class="form-label">Nombre:</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        value="{{ user.username|default:'' }}" 
                        placeholder="Ingresa tu nombre" 
                        required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        value="{{ user.email|default:'' }}" 
                        placeholder="Ingresa tu email" 
                        required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Nueva contraseña (opcional)">
                </div>
                <div class="form-group">
                    <label for="phone_number" class="form-label">Teléfono:</label>
                    <input 
                        type="text" 
                        id="phone_number" 
                        name="phone_number" 
                        class="form-input" 
                        value="{{ user.profile.phone_number|default:'' }}" 
                        placeholder="Número de teléfono">
                </div>
            </div>
        
            <!-- Columna derecha (con dirección, ciudad, estado y código postal) -->
            <div>
                <div class="form-group">
                    <label for="address" class="form-label">Dirección:</label>
                    <input 
                        type="text" 
                        id="address" 
                        name="address" 
                        class="form-input" 
                        value="{{ user.profile.address|default:'' }}" 
                        placeholder="Dirección">
                </div>
                <div class="form-group">
                    <label for="city" class="form-label">Ciudad:</label>
                    <input 
                        type="text" 
                        id="city" 
                        name="city" 
                        class="form-input" 
                        value="{{ user.profile.city|default:'' }}" 
                        placeholder="Ciudad">
                </div>
                <div class="form-group">
                    <label for="state" class="form-label">Estado:</label>
                    <input 
                        type="text" 
                        id="state" 
                        name="state" 
                        class="form-input" 
                        value="{{ user.profile.state|default:'' }}" 
                        placeholder="Estado">
                </div>
                <div class="form-group">
                    <label for="zip_code" class="form-label">Código Postal:</label>
                    <input 
                        type="text" 
                        id="zip_code" 
                        name="zip_code" 
                        class="form-input" 
                        value="{{ user.profile.zip_code|default:'' }}" 
                        placeholder="Código Postal">
                </div>
            </div>
        </div>        

        <!-- Botón para guardar cambios -->
        <button type="submit" class="login-button">Guardar Cambios</button>

        <!-- Enlace para volver al Home -->
        <div class="bottom-spacer">
            <a href="{% url 'home' %}" class="forgot-password-link">Volver al Home</a>
        </div>
    </form>
</main>
{% endblock %}
