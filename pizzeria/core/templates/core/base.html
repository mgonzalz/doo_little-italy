<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}{% endblock %} | The Little Italy</title>
	{% load static %}
	<link rel="stylesheet" href="{% static 'core/css/styles.css' %}" type="text/css">
	<!-- Fuentes de Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&family=Quattrocento:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
	<nav class="nav-header">
		<!-- Logo y enlaces cercanos -->
		<div class="nav-left">
		<a href="#" class="brand-logo">The Little Italy</a>
			<div class="nav-menu">
				<a href="#menu">Menu</a>
				<a href="#cart">Shopping Cart</a>
			</div>
		</div>
		<!-- Enlaces de la derecha -->
		<div class="nav-right">
			<a href="{% url 'contact' %}">Contact</a>
			<a href="#about">About Us</a>
			<a href="#login">Login</a>
			<a href="#register" class="register-button">Register</a>

	{% block content %}{% endblock %}
