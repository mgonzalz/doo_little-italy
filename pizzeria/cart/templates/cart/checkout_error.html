{% extends 'core/base.html' %}

{% load static %}  <!-- Add this line here -->

{% block title %}Checkout Error{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'cart/css/checkout_error.css' %}">

<div class="error-container">
    <h1>Something went wrong</h1>
    <p class="error-message">
        We encountered an issue during the checkout process. Please try again.
    </p>

    {% if error %}
    <div class="error-details">
        <p><strong>Error Details:</strong></p>
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <a href="{% url 'cart_view' %}" class="go-back-btn">Go back to Cart</a>
</div>
{% endblock %}
